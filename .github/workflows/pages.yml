name: Deploy password-protected atlas
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-atlas
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: private-atlas
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:private
      - run: npm run build:private
      - name: Verify required deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_PASSWORD_VERIFIER: ${{ secrets.ATLAS_PASSWORD_VERIFIER }}
          ATLAS_SESSION_SECRET: ${{ secrets.ATLAS_SESSION_SECRET }}
        run: |
          node -e 'for (const key of ["CLOUDFLARE_API_TOKEN","CLOUDFLARE_ACCOUNT_ID","ATLAS_PASSWORD_VERIFIER","ATLAS_SESSION_SECRET"]) if (!process.env[key]) throw new Error("Missing secret: "+key)'
      - name: Store server-only secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_PASSWORD_VERIFIER: ${{ secrets.ATLAS_PASSWORD_VERIFIER }}
          ATLAS_SESSION_SECRET: ${{ secrets.ATLAS_SESSION_SECRET }}
        run: |
          node -e 'process.stdout.write(JSON.stringify({ATLAS_PASSWORD_VERIFIER:process.env.ATLAS_PASSWORD_VERIFIER,ATLAS_SESSION_SECRET:process.env.ATLAS_SESSION_SECRET}))' | npx wrangler secret bulk --config wrangler.private.jsonc
      - name: Deploy protected worker and assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:private
