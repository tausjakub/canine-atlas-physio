name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refuse licensed files in the repository
        run: |
          if git ls-files | grep -iE '\.pdf$|^private-assets/|(^|/)\.env|\.dev\.vars'; then
            echo "Licensed or secret files are tracked. Remove them." >&2
            exit 1
          fi
      - run: npm run typecheck
      - run: npx oxlint
      - run: npx oxfmt --check
      - run: npm run validate
      - run: npm run build:demo
